name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vite build --mode demo --base /demo/ --outDir site/demo --emptyOutDir
      - name: Stage Microsoft Store installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r tag; do
            case "$tag" in
              ''|\#*) continue ;;
            esac
            version="${tag#v}"
            mkdir -p "site/downloads/$tag"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "KestralBudget-Setup-${version}.exe" \
              --dir "site/downloads/$tag"
          done < .github/store-package-versions.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
