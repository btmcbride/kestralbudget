name: Desktop Builds

on:
  push:
    tags:
      - 'v*' # This forces the workflow to ONLY trigger when a tag like v1.1.4 is pushed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Sign Executable
        env:
          AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
          $targetExe = Get-ChildItem -Path "./release/windows" -Filter "*.exe" -Recurse | Select-Object -First 1
          
          if ($null -eq $targetExe) {
              throw "Could not find the executable to sign!"
          }
          
          # Force absolute paths to prevent signtool from getting lost
          $dlib = Convert-Path ".signing/Azure.CodeSigning.Dlib.dll"
          $dmdf = Convert-Path ".signing/metadata.json"
          
          Write-Host "Signing: $($targetExe.FullName)"
          & $signtool sign /v /fd SHA256 /tr "http://timestamp.acs.microsoft.com" /td SHA256 /dlib $dlib /dmdf $dmdf "$($targetExe.FullName)" 
      - uses: actions/upload-artifact@v4
        with:
          name: KestralBudget-windows
          path: release/windows/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: iconutil -c icns assets/kestral-budget.iconset --output assets/kestral-budget.icns
      - run: npm run build
      - run: npx electron-builder --mac dmg --arm64 --config.directories.output=release/mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: KestralBudget-mac-arm64
          path: release/mac/*.dmg
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KestralBudget-windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: KestralBudget-mac-arm64
          path: release/mac
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/windows/*.exe
            release/mac/*.dmg
