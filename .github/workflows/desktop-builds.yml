name: Desktop Builds

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  KESTRAL_BUILD_CHANNEL: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'stable' || 'dev' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build stable Windows installer
        if: env.KESTRAL_BUILD_CHANNEL == 'stable'
        run: npm run desktop:dist
        env:
          AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      - name: Build dev Windows installer
        if: env.KESTRAL_BUILD_CHANNEL == 'dev'
        run: npm run desktop:dist:dev
        env:
          AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      - uses: actions/upload-artifact@v4
        with:
          name: KestralBudget-${{ env.KESTRAL_BUILD_CHANNEL }}-windows-${{ github.run_id }}
          path: release/windows${{ env.KESTRAL_BUILD_CHANNEL == 'dev' && '-dev' || '' }}/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build stable macOS installer
        if: env.KESTRAL_BUILD_CHANNEL == 'stable'
        run: npm run desktop:dist:mac
      - name: Build dev macOS installer
        if: env.KESTRAL_BUILD_CHANNEL == 'dev'
        run: npm run desktop:dist:mac:dev
      - uses: actions/upload-artifact@v4
        with:
          name: KestralBudget-${{ env.KESTRAL_BUILD_CHANNEL }}-mac-arm64-${{ github.run_id }}
          path: release/mac${{ env.KESTRAL_BUILD_CHANNEL == 'dev' && '-dev' || '' }}/*.dmg
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KestralBudget-stable-windows-${{ github.run_id }}
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: KestralBudget-stable-mac-arm64-${{ github.run_id }}
          path: release/mac
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/windows/*.exe
            release/mac/*.dmg
