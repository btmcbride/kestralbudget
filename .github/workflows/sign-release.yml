name: Build and Sign Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node/Build Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Adjust if needed for your package.json build process

      - name: Install dependencies & Build
        run: |
          npm install
          npm run build # Replace with whatever command generates your KestralBudget-Setup-*.exe

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sign Executable
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
          # Find the built executable dynamically using a wildcard
          $targetExe = Get-ChildItem -Path "./dist", "./publish" -Filter "KestralBudget-Setup-*.exe" -Recurse | Select-Object -First 1
          
          if ($null -eq $targetExe) {
              throw "Could not find the executable to sign!"
          }
          
          Write-Host "Signing: $($targetExe.FullName)"
          & $signtool sign /v /fd SHA256 /tr "http://timestamp.acs.microsoft.com" /td SHA256 /dlib ".signing/Azure.CodeSigning.Dlib.dll" /dmdf ".signing/metadata.json" "$($targetExe.FullName)"

      - name: Create GitHub Release & Upload Signed App
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            publish/*.exe