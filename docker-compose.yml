services:
  kestralbudget:
    build:
      context: .
      dockerfile: DockerFile
    container_name: kestralbudget
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      DATABASE_PATH: ${DATABASE_PATH:-/data/kestralbudget.sqlite}
    volumes:
      - kestralbudget-data:/data
    restart: unless-stopped

volumes:
  kestralbudget-data:
